apiVersion: apps/v1
kind: Deployment
metadata:
  name: delivery-gateway
  namespace: delivery
spec:
  replicas: 1
  selector: {matchLabels: {app: delivery-gateway}}
  template:
    metadata: {labels: {app: delivery-gateway}}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: gateway
          image: delivery/gateway:latest
          ports: [{containerPort: 8081}]
          env:
            - {name: IDENTITY_SERVICE_URL, value: http://identity-service:8080}
            - {name: CATALOG_SERVICE_URL, value: http://catalog-service:8080}
            - {name: CART_SERVICE_URL, value: http://cart-service:8080}
            - {name: ORDER_SERVICE_URL, value: http://order-service:8080}
            - {name: MEDIA_SERVICE_URL, value: http://media-service:8080}
          readinessProbe: {httpGet: {path: /actuator/health/readiness, port: 8081}}
          livenessProbe: {httpGet: {path: /actuator/health/liveness, port: 8081}}
---
apiVersion: v1
kind: Service
metadata: {name: delivery-gateway, namespace: delivery}
spec:
  selector: {app: delivery-gateway}
  ports: [{port: 8081, targetPort: 8081}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: delivery-api, namespace: delivery}
spec:
  rules:
    - http:
        paths:
          - path: /api/v1
            pathType: Prefix
            backend: {service: {name: delivery-gateway, port: {number: 8081}}}

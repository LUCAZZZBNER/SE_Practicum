apiVersion: apps/v1
kind: Deployment
metadata: {name: identity-service, namespace: delivery}
spec:
  replicas: 1
  selector: {matchLabels: {app: identity-service}}
  template:
    metadata: {labels: {app: identity-service}}
    spec:
      containers:
        - {name: service, image: delivery/identity-service:latest, ports: [{containerPort: 8080}], envFrom: [{secretRef: {name: delivery-secrets}}], env: [{name: SERVICE_NAME, value: identity-service}, {name: IDENTITY_DATASOURCE_URL, value: jdbc:mysql://mysql:3306/delivery_identity}, {name: INTERNAL_SERVICE_TOKEN, valueFrom: {secretKeyRef: {name: delivery-secrets, key: INTERNAL_SERVICE_TOKEN}}}]}
---
apiVersion: v1
kind: Service
metadata: {name: identity-service, namespace: delivery}
spec: {selector: {app: identity-service}, ports: [{port: 8080, targetPort: 8080}]}
---

spring.application.name=delivery-gateway
server.port=${SERVER_PORT:8081}
# The gateway forwards multipart bytes untouched; parsing them here would consume
# the servlet request before the media service receives it.
spring.servlet.multipart.enabled=false
# Optional rollback-only compatibility target. Production Compose/Kubernetes
# deployments leave it unset and route every public resource to an owner service.
gateway.backend-base-url=${BACKEND_BASE_URL:}
gateway.identity-url=${IDENTITY_SERVICE_URL:}
gateway.catalog-url=${CATALOG_SERVICE_URL:}
gateway.cart-url=${CART_SERVICE_URL:}
gateway.order-url=${ORDER_SERVICE_URL:}
gateway.media-url=${MEDIA_SERVICE_URL:}
gateway.connect-timeout-ms=${GATEWAY_CONNECT_TIMEOUT_MS:2000}
gateway.read-timeout-ms=${GATEWAY_READ_TIMEOUT_MS:10000}
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true

# Allow load balancers to drain requests before an instance exits.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=${SHUTDOWN_TIMEOUT:20s}

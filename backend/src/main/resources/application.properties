spring.application.name=backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.datasource.username=${DELIVERY_DB_USERNAME}
spring.datasource.password=${DELIVERY_DB_PASSWORD}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

mybatis.mapper-locations=classpath*:mapper/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

spring.jackson.deserialization.fail-on-unknown-properties=true
security.jwt.secret=${JWT_SECRET:local-development-secret-change-before-production}
security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:7200}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.acks=all
spring.kafka.producer.enable-idempotence=true
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.[delivery.timeout.ms]=120000
spring.kafka.producer.transaction-id-prefix=${KAFKA_TRANSACTION_ID_PREFIX:delivery-backend-}
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.[spring.json.value.default.type]=com.delivery.backend.events.DomainEvent
spring.kafka.consumer.properties.[spring.json.trusted.packages]=com.delivery.backend

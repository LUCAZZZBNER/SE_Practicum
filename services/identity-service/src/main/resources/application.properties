spring.application.name=identity-service
server.port=${SERVER_PORT:8080}
spring.datasource.url=${IDENTITY_DATASOURCE_URL:jdbc:mysql://localhost:3306/delivery_identity?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${IDENTITY_DB_USERNAME:delivery}
spring.datasource.password=${IDENTITY_DB_PASSWORD:delivery}
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.table=${IDENTITY_FLYWAY_TABLE:identity_flyway_schema_history}
mybatis.mapper-locations=classpath*:mapper/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
spring.jackson.deserialization.fail-on-unknown-properties=true
security.jwt.secret=${JWT_SECRET:local-development-secret-change-before-production}
security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:7200}
security.internal-service-token=${INTERNAL_SERVICE_TOKEN:local-internal-service-token-change-me}
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true

# Allow load balancers to drain requests before an instance exits.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=${SHUTDOWN_TIMEOUT:20s}

spring.application.name=order-service
server.port=${SERVER_PORT:8080}
spring.datasource.url=${ORDER_DATASOURCE_URL:jdbc:mysql://localhost:3306/delivery_order?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${ORDER_DB_USERNAME:delivery}
spring.datasource.password=${ORDER_DB_PASSWORD:delivery}
spring.flyway.locations=classpath:db/migration
spring.flyway.table=${ORDER_FLYWAY_TABLE:order_flyway_schema_history}
spring.flyway.baseline-on-migrate=${SPRING_FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=${SPRING_FLYWAY_BASELINE_VERSION:1}
mybatis.mapper-locations=classpath*:mapper/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
spring.jackson.deserialization.fail-on-unknown-properties=true
security.jwt.secret=${JWT_SECRET:local-development-secret-change-before-production}
security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:7200}
services.catalog-url=${SERVICES_CATALOG_URL:}
services.cart-url=${SERVICES_CART_URL:}
security.internal-service-token=${INTERNAL_SERVICE_TOKEN:}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.retries=10
spring.kafka.producer.properties.max.block.ms=1000
spring.kafka.producer.properties.delivery.timeout.ms=15000
spring.kafka.producer.properties.request.timeout.ms=5000
events.outbox-poll-ms=${EVENTS_OUTBOX_POLL_MS:1000}
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true

# Allow load balancers to drain requests before an instance exits.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=${SHUTDOWN_TIMEOUT:20s}

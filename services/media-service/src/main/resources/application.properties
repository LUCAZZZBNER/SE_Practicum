spring.application.name=media-service
server.port=${SERVER_PORT:8080}
spring.datasource.url=${MEDIA_DATASOURCE_URL:jdbc:mysql://localhost:3306/delivery_media?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${MEDIA_DB_USERNAME:delivery}
spring.datasource.password=${MEDIA_DB_PASSWORD:delivery}
spring.flyway.locations=classpath:db/migration
spring.flyway.table=${MEDIA_FLYWAY_TABLE:media_flyway_schema_history}
spring.flyway.baseline-on-migrate=${SPRING_FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=${SPRING_FLYWAY_BASELINE_VERSION:1}
mybatis.mapper-locations=classpath*:mapper/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
spring.jackson.deserialization.fail-on-unknown-properties=true
security.jwt.secret=${JWT_SECRET:local-development-secret-change-before-production}
security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:7200}
security.internal-service-token=${INTERNAL_SERVICE_TOKEN:local-internal-service-token-change-me}
identity.internal-url=${IDENTITY_INTERNAL_URL:http://identity-service:8080}
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true

# Allow load balancers to drain requests before an instance exits.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=${SHUTDOWN_TIMEOUT:20s}
